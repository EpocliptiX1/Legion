<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AniKino Embed Tester</title>
  <style>
    :root { color-scheme:dark; font-family:system-ui,sans-serif; background:#0d0d10; color:#f7f7f7; }
    body { max-width:1100px; margin:auto; padding:24px; }
    h1 { margin:0 0 8px; } p { color:#b9b9c2; }
    form { display:grid; grid-template-columns:repeat(5,minmax(120px,1fr)); gap:12px; padding:16px; background:#19191f; border:1px solid #353540; border-radius:12px; }
    label { display:grid; gap:6px; font-size:.86rem; font-weight:700; }
    input,select,button { min-height:42px; box-sizing:border-box; border-radius:8px; font:inherit; }
    input,select { width:100%; padding:0 10px; border:1px solid #444451; background:#101014; color:inherit; }
    #extra { grid-column:1/-1; display:flex; align-items:end; gap:18px; flex-wrap:wrap; }
    #extra label { display:flex; align-items:center; gap:7px; } #extra input { width:auto; min-height:auto; }
    button { padding:0 20px; border:0; background:#ff8000; color:#211307; font-weight:800; cursor:pointer; }
    #status { min-height:1.5em; word-break:break-word; } iframe { width:100%; aspect-ratio:16/9; border:1px solid #353540; border-radius:12px; background:#000; }
    @media(max-width:700px){ form { grid-template-columns:1fr 1fr; } }
  </style>
</head>
<body>
  <h1>AniKino embed tester</h1>
  <p>Loads the public, tokenized <code>/embed/*</code> player only. No upstream stream address is read, shown, or stored here.</p>
  <form id="test-form">
    <label>Type <select id="type"><option value="anime">Anime</option><option value="tv">TV</option><option value="movie">Movie</option></select></label>
    <label>Media ID <input id="id" value="1429" required maxlength="64" placeholder="TMDB / MAL / IMDb ID"></label>
    <label>Season <input id="season" value="1" required inputmode="numeric" pattern="[1-9][0-9]*"></label>
    <label>Episode <input id="episode" value="1" required inputmode="numeric" pattern="[1-9][0-9]*"></label>
    <label>Server <select id="server"></select></label>
    <div id="extra">
      <label id="audio-label">Audio <select id="audio"><option value="sub">Sub</option><option value="dub">Dub</option></select></label>
      <label><input id="autoplay" type="checkbox"> Autoplay</label>
      <label><input id="autonext" type="checkbox"> Auto-next</label>
      <button type="submit">Play</button>
    </div>
  </form>
  <p id="status" role="status">Ready.</p>
  <iframe id="player" title="AniKino player" allow="autoplay; fullscreen; picture-in-picture" allowfullscreen></iframe>
  <script>
    (() => {
      const $ = id => document.getElementById(id);
      const form = $('test-form'), type = $('type'), mediaId = $('id'), season = $('season'), episode = $('episode');
      const server = $('server'), audio = $('audio'), audioLabel = $('audio-label'), autoplay = $('autoplay'), autonext = $('autonext');
      const player = $('player'), status = $('status');
      const providers = { anime:['mega','kaa','neko','ru'], tv:['kino','ru'], movie:['kino','ru'] };
      function sync() {
        const movie = type.value === 'movie';
        season.disabled = movie; episode.disabled = movie; autonext.disabled = movie;
        audioLabel.hidden = type.value !== 'anime';
        server.replaceChildren(...providers[type.value].map(name => new Option(name, name)));
      }
      function url() {
        const value = mediaId.value.trim();
        if (!/^(?:\d+|tt\d+|mal-\d+|(?:anilist|al)-\d+)$/i.test(value)) throw Error('Enter a numeric TMDB ID, tt IMDb ID, mal-ID, or anilist-ID.');
        const query = new URLSearchParams({ server:server.value });
        if (type.value === 'anime') { query.set('season', season.value); query.set('audio', audio.value); }
        if (autoplay.checked) query.set('autoplay', '1');
        if (autonext.checked && type.value !== 'movie') query.set('autonext', '1');
        const id = encodeURIComponent(value);
        let path;
        if (type.value === 'movie') path = `/embed/movie/${id}`;
        else if (type.value === 'tv') path = `/embed/tv/${id}/${encodeURIComponent(season.value)}/${encodeURIComponent(episode.value)}`;
        else path = `/embed/anime/${id}/${encodeURIComponent(episode.value)}`;
        return `${path}?${query}`;
      }
      type.addEventListener('change', sync);
      form.addEventListener('submit', event => {
        event.preventDefault(); if (!form.reportValidity()) return;
        try { const src = url(); player.src = src; status.textContent = `Loading ${type.value} on ${server.value}: ${src}`; }
        catch (error) { status.textContent = error.message; }
      });
      window.addEventListener('message', event => {
        if (event.origin === location.origin && event.data?.source === 'anikino-embed') status.textContent = `Player: ${event.data.event}`;
      });
      sync();
    })();
  </script>
</body>
</html>
