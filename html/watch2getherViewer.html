<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Watch2Gether - Legion Space</title>
    <style>
        * { box-sizing: border-box; }
        html, body { margin: 0; padding: 0; height: 100%; background: #0c0c0c; font-family: Arial, sans-serif; }
        .w2g-bar {
            position: fixed;
            top: 0; left: 0; right: 0;
            height: 46px;
            background: #141414;
            border-bottom: 1px solid #333;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 16px;
            z-index: 10;
        }
        .w2g-bar-label {
            color: #fff;
            font-size: 0.85rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .w2g-dot {
            width: 8px; height: 8px;
            border-radius: 50%;
            background: #f96d00;
            animation: w2g-pulse 1.4s infinite;
        }
        @keyframes w2g-pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.35; }
        }
        .w2g-leave {
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.15);
            color: #fff;
            padding: 6px 14px;
            border-radius: 6px;
            font-size: 0.78rem;
            font-weight: 700;
            cursor: pointer;
        }
        .w2g-leave:hover { border-color: #f96d00; color: #f96d00; }
        .w2g-request {
            background: #f96d00;
            border: 1px solid #f96d00;
            color: #fff;
            padding: 6px 14px;
            border-radius: 6px;
            font-size: 0.78rem;
            font-weight: 700;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .w2g-request svg {
            width: 14px;
            height: 14px;
        }
        .w2g-request:disabled {
            background: rgba(255,255,255,0.08);
            border-color: rgba(255,255,255,0.15);
            color: rgba(255,255,255,0.4);
            cursor: default;
        }
        .w2g-bar-right { display: flex; align-items: center; gap: 10px; }
        .w2g-frame-wrap {
            position: absolute;
            top: 46px; left: 0; right: 0; bottom: 0;
        }
        iframe {
            width: 100%; height: 100%;
            border: none;
            display: block;
        }
        .w2g-waiting {
            position: absolute;
            top: 46px; left: 0; right: 0; bottom: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            color: rgba(255,255,255,0.5);
            font-size: 0.9rem;
            text-align: center;
            padding: 20px;
        }
    </style>
</head>
<body>
    <div class="w2g-bar">
        <div class="w2g-bar-label"><span class="w2g-dot" id="w2gDot"></span> <span id="w2gStatusText">Waiting for your friend to start...</span></div>
        <div class="w2g-bar-right">
            <button class="w2g-request" id="w2gRequestBtn" onclick="requestWatch2GetherControl()"><svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M10.05 4.575a1.575 1.575 0 1 0-3.15 0v3m3.15-3v-1.5a1.575 1.575 0 0 1 3.15 0v1.5m-3.15 0 .075 5.925m3.075.75V4.575m0 0a1.575 1.575 0 0 1 3.15 0V15M6.9 7.575a1.575 1.575 0 1 0-3.15 0v8.175a6.75 6.75 0 0 0 6.75 6.75h2.018a5.25 5.25 0 0 0 3.712-1.538l1.732-1.732a5.25 5.25 0 0 0 1.538-3.712l.003-2.024a.668.668 0 0 1 .198-.471 1.575 1.575 0 1 0-2.228-2.228 3.818 3.818 0 0 0-1.12 2.687M6.9 7.575V12m6.27 4.318A4.49 4.49 0 0 1 16.35 15m.002 0h-.002" /></svg> Request to Interact</button>
            <button class="w2g-leave" onclick="window.close()">Leave</button>
        </div>
    </div>
    <div class="w2g-frame-wrap">
        <div class="w2g-waiting" id="w2gWaiting">Waiting for your friend to start hosting...</div>
        <iframe id="w2gFrame" style="display:none;"></iframe>
    </div>
    <script src="/js/watch2getherViewer.js"></script>
</body>
</html>
